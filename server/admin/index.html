<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veyrion Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <img src="/admin/assets/logo.png" alt="Veiryon Studios" class="login-logo">
        <h1>Admin Panel</h1>
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>
          </div>
          <div id="login-error" class="error-msg" hidden></div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="dashboard-screen" hidden>
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <img src="/admin/assets/logo.png" alt="Veiryon Studios" class="sidebar-logo">
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" data-page="dashboard">Dashboard</a>
          <a href="#" class="nav-item" data-page="users">Users</a>
          <a href="#" class="nav-item" data-page="products">Products</a>
          <a href="#" class="nav-item" data-page="orders">Orders</a>
          <a href="#" class="nav-item" data-page="licenses">Licenses</a>
          <a href="#" class="nav-item" data-page="tickets">Tickets</a>
          <a href="#" class="nav-item" data-page="coupons">Coupons</a>
          <a href="#" class="nav-item" data-page="subscribers">Subscribers</a>
          <a href="#" class="nav-item" data-page="settings">Settings</a>
          <a href="#" class="nav-item" data-page="logs">Audit Logs</a>
        </nav>
        <div class="sidebar-footer">
          <span class="sidebar-user" id="admin-name">Admin</span>
          <button class="btn-link" id="logout-btn">Sign Out</button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="main-header">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <h2 id="page-title">Dashboard</h2>
          <div class="header-actions">
            <button class="btn btn-sm" id="refresh-btn">Refresh</button>
          </div>
        </header>

        <div id="page-content" class="page-content">
          <!-- Dynamic content loaded here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script src="/admin/js/admin.js"></script>
</body>
</html>
