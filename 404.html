<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Veyrion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 48px 24px; text-align: center;
    }
    .error-page__code {
      font-family: var(--font-display); font-size: clamp(80px, 15vw, 160px);
      font-weight: 700; letter-spacing: -0.05em; line-height: 0.9;
      color: var(--text-4); margin-bottom: 24px;
    }
    .error-page__title {
      font-family: var(--font-display); font-size: 24px; font-weight: 600;
      letter-spacing: -0.02em; margin-bottom: 12px;
    }
    .error-page__body {
      color: var(--text-2); font-size: 15px; line-height: 1.6;
      max-width: 44ch; margin: 0 auto 32px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Page not found</h1>
      <p class="error-page__body">The page you're looking for doesn't exist, or has been moved. If you think this is wrong, let us know.</p>
      <div style="display:flex;gap:10px;justify-content:center;">
        <a href="index.html" class="btn btn--primary">Go home</a>
        <a href="contact.html" class="btn">Contact us</a>
      </div>
    </div>
  </div>
</body>
</html>
