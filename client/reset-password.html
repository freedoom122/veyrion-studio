<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101010"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261118-1"><title>Reset password — Veyrion</title><link rel="stylesheet" href="styles.css?v=20261113-1">
<link rel="stylesheet" href="refinements.css?v=20261118-1"><style>
.reset-shell{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 15%,rgba(201,167,123,.09),transparent 42%),#070809}.reset-card{width:min(480px,100%);padding:clamp(26px,5vw,44px);border:1px solid rgba(201,167,123,.24);border-radius:4px;background:rgba(15,16,14,.96);box-shadow:0 30px 90px rgba(0,0,0,.4)}.reset-mark{font:600 12px monospace;letter-spacing:.22em;color:var(--accent,#c9a77b)}.reset-card h1{font-size:clamp(34px,7vw,48px);letter-spacing:-.06em;margin:24px 0 12px}.reset-card p{color:var(--text-2,#a6aeaa);line-height:1.7}.reset-card .field{margin:20px 0}.reset-card label{display:block;margin-bottom:8px}.reset-card input{width:100%;padding:14px 15px;border-radius:8px;border:1px solid var(--border-2,rgba(232,219,197,.2));background:#0b0e0d;color:#fff}.reset-card button{width:100%;margin-top:12px}.reset-message{min-height:24px;font-size:13px}.reset-message.error{color:#ff8c8c}.reset-message.success{color:var(--accent,#c9a77b)}
</style><link rel="stylesheet" href="/brand-identity.css?v=20261118-1">
</head><body><main class="reset-shell"><section class="reset-card"><span class="reset-mark">VEYRION / ACCOUNT RECOVERY</span><h1>Choose a new password.</h1><p>Use at least 14 characters. The recovery link is single-use and expires after one hour.</p><form id="reset-form"><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="14" required></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="14" required></div><button class="btn btn--primary" id="reset-submit" type="submit">Update password</button><p class="reset-message" id="reset-message" role="status" aria-live="polite"></p></form><p><a href="index.html">Return to Veyrion</a></p></section></main>
